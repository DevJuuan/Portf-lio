<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Juan Vicente — Portfólio</title>
  <meta name="description" content="Portfólio de Juan Vicente: sobre, skills, formação e projetos web.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<analytics/>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #f6f2ff;
      --muted: #bdb4e0;
      --co: #ff8a5c;
      --go: #ffd36e;
      --gl: rgba(20, 13, 52, .58);
      --ln: rgba(255, 255, 255, .16);
      --dk: #1a0f33;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px
    }

    body {
      margin: 0;
      background: #0c0a26;
      color: var(--ink);
      font: 400 1.05rem/1.65 "Instrument Sans", system-ui, sans-serif;
      overflow-x: hidden
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--go);
      outline-offset: 3px;
      border-radius: 6px
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden
    }

    .sky {
      position: absolute;
      inset: 0
    }

    .stars {
      position: absolute;
      left: 0;
      right: 0;
      top: -15vh;
      height: 130vh
    }

    .stars i {
      position: absolute;
      border-radius: 50%;
      background: #fff
    }

    .tw {
      animation: tw 3s ease-in-out infinite
    }

    @keyframes tw {
      50% {
        opacity: .2
      }
    }

    .moon {
      position: absolute;
      left: 12vw;
      top: 16vh;
      width: 9vmin;
      height: 9vmin;
      border-radius: 50%;
      background: #eef0ff;
      box-shadow: 0 0 40px 8px rgba(200, 210, 255, .45)
    }

    .sun {
      position: absolute;
      right: 14vw;
      top: 14vh;
      width: 24vmin;
      height: 24vmin;
      border-radius: 50%
    }

    .mt {
      position: absolute;
      left: -3%;
      bottom: -2px;
      width: 106%;
      height: 42vh
    }

    .glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 520px;
      height: 520px;
      margin: -260px 0 0 -260px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 170, 120, .16), transparent 65%)
    }

    main,
    footer {
      position: relative;
      z-index: 1
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2rem)
    }

    section {
      padding: clamp(3rem, 8vw, 6rem) 0
    }

    h2 {
      font: 800 clamp(2.6rem, 7vw, 4.6rem)/1 "Big Shoulders Display", sans-serif;
      letter-spacing: .02em;
      margin-bottom: 2rem;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .35)
    }

    h3 {
      font: 800 clamp(1.8rem, 3.4vw, 2.5rem)/1.05 "Big Shoulders Display", sans-serif;
      letter-spacing: .02em
    }

    .gl {
      background: var(--gl);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--ln);
      border-radius: 22px
    }

    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 2rem;
      padding-bottom: 6rem;
      position: relative
    }

    .hn {
      display: flex;
      justify-content: center;
      gap: 0 .26em;
      white-space: nowrap;
      font: 900 clamp(2.4rem, 15vw, 9.5rem)/.95 "Big Shoulders Display", sans-serif;
      text-transform: uppercase;
      letter-spacing: .005em;
      filter: drop-shadow(0 4px 30px rgba(0, 0, 0, .4))
    }

    .w {
      display: inline-flex
    }

    .sp {
      display: inline-block;
      width: .26em
    }

    .cm {
      display: inline-block;
      overflow: hidden;
      padding-bottom: .07em;
      will-change: transform
    }

    .ch {
      display: inline-block;
      background: linear-gradient(180deg, #fff 35%, var(--go));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rise 1s cubic-bezier(.2, .8, .2, 1) both
    }

    .ch.hot {
      background-image: linear-gradient(180deg, #fff 5%, var(--co))
    }

    .hw {
      display: inline-block;
      animation: rise 1s cubic-bezier(.2, .8, .2, 1) both
    }

    .hrow {
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2.5rem;
      animation: up .9s .5s cubic-bezier(.2, .8, .2, 1) both
    }

    .txt {
      flex: 1;
      min-width: 260px
    }

    .lead {
      font-weight: 800;
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      line-height: 1.25;
      margin-bottom: .6rem
    }

    .sub {
      color: var(--muted);
      max-width: 36em
    }

    .lks {
      display: flex;
      gap: .7rem;
      flex-wrap: wrap;
      margin: 1.3rem 0 0;
      padding: 0;
      list-style: none
    }

    .chip {
      display: inline-block;
      padding: .65rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      border: 1.5px solid var(--ln);
      background: var(--gl);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .2s, background .2s, color .2s
    }

    .chip:hover {
      transform: translateY(-3px);
      background: var(--co);
      color: var(--dk);
      border-color: var(--co)
    }

    .ph {
      flex: none;
      position: relative;
      width: clamp(110px, 16vw, 170px);
      aspect-ratio: 3/4;
      border-radius: 999px 999px 20px 20px;
      border: 1.5px dashed var(--muted);
      background: var(--gl);
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      padding: .5rem;
      transition: border-color .2s
    }

    .ph:hover {
      border-color: var(--go)
    }

    .ph:focus-within {
      outline: 3px solid var(--go);
      outline-offset: 3px
    }

    .ph img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .ph input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer
    }

    .cue {
      position: absolute;
      left: clamp(1rem, 4vw, 2rem);
      bottom: 5.5rem;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: .9rem
    }

    @keyframes rise {
      from {
        transform: translateY(105%)
      }
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(22px)
      }
    }

    @keyframes pulse {
      50% {
        opacity: .4
      }
    }

    .rv {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .7s, transform .7s cubic-bezier(.2, .7, .2, 1)
    }

    .rv.in {
      opacity: 1;
      transform: none
    }

    .mq {
      overflow: hidden;
      border-block: 1px solid var(--ln);
      background: rgba(10, 6, 34, .4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: .7rem 0;
      white-space: nowrap;
      position: relative;
      z-index: 1
    }

    .mq div {
      display: inline-block;
      animation: mq 60s linear infinite;
      font: 800 2.2rem/1 "Big Shoulders Display", sans-serif;
      letter-spacing: .04em
    }

    .mq span {
      margin: 0 1.3rem
    }

    .mq b {
      color: var(--co);
      font-weight: 400
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    .ab {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem 4rem;
      align-items: start
    }

    .pull {
      font: 800 clamp(2.4rem, 6vw, 4.4rem)/.98 "Big Shoulders Display", sans-serif;
      background: linear-gradient(180deg, #fff, var(--co));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .ab p+p {
      margin-top: 1rem
    }

    .ab p {
      max-width: 62ch
    }

    .sg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.2rem
    }

    .tilt {
      padding: 1.6rem;
      height: 100%;
      transition: transform .25s ease-out, border-color .25s;
      will-change: transform
    }

    .tilt:hover {
      border-color: var(--go)
    }

    .gy {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--go), var(--co));
      color: var(--dk);
      font-weight: 800;
      margin-bottom: 1rem
    }

    .tilt p {
      color: var(--muted);
      margin-top: .4rem
    }

    .tl {
      position: relative;
      margin-left: .5rem;
      padding-left: 2rem;
      border-left: 2px solid var(--ln)
    }

    .ti {
      position: relative;
      margin-bottom: 1.4rem
    }

    .ti .gl {
      padding: 1.4rem 1.6rem
    }

    .ti::before {
      content: "";
      position: absolute;
      left: calc(-2rem - 8px);
      top: 1.7rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      border: 3px solid #0c0a26
    }

    .ti.on::before {
      background: var(--go);
      box-shadow: 0 0 0 6px rgba(255, 211, 110, .25);
      animation: pulse 2s infinite
    }

    .tag {
      display: inline-block;
      font-size: .8rem;
      font-weight: 800;
      padding: .1rem .75rem;
      border-radius: 999px;
      border: 1px solid var(--ln);
      color: var(--muted);
      margin-bottom: .5rem
    }

    .ti.on .tag {
      color: var(--dk);
      background: var(--go);
      border-color: var(--go)
    }

    .ti p {
      color: var(--muted)
    }

    .pj {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 2rem 3rem;
      align-items: center;
      padding: 1.5rem;
      margin-bottom: 1.6rem
    }

    .pj.alt .mw {
      order: 2
    }

    .pj p {
      color: var(--muted);
      margin: .6rem 0 1.2rem
    }

    .pls {
      display: flex;
      gap: .7rem;
      flex-wrap: wrap
    }

    .fr {
      border: 1px solid var(--ln);
      border-radius: 14px;
      background: rgba(10, 6, 34, .6);
      overflow: hidden;
      will-change: transform;
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6)
    }

    .fh {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--ln)
    }

    .fh i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ln)
    }

    .scr {
      padding: 18px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .scr.c {
      align-items: center;
      justify-content: center
    }

    .b {
      border-radius: 5px;
      background: rgba(255, 255, 255, .2)
    }

    .row3 {
      display: flex;
      gap: 10px;
      margin-bottom: 8px
    }

    .btnm {
      width: 90px;
      height: 26px;
      border-radius: 13px;
      background: linear-gradient(90deg, var(--co), var(--go))
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: auto
    }

    .cards i {
      height: 54px;
      border-radius: 8px;
      border: 1px solid var(--ln)
    }

    .q {
      font: 800 5rem/1 "Big Shoulders Display", sans-serif;
      color: var(--go)
    }

    .inp {
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--ln)
    }

    .ct {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      padding: clamp(1.5rem, 4vw, 3rem);
      align-items: center
    }

    .big {
      font: 800 clamp(2.8rem, 7vw, 5rem)/.95 "Big Shoulders Display", sans-serif;
      margin: 0 0 1rem
    }

    .cs {
      color: var(--muted);
      max-width: 30em
    }

    .cl {
      list-style: none;
      margin: 1.4rem 0 0;
      padding: 0;
      display: grid;
      gap: .4rem
    }

    .cl a {
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid currentColor
    }

    form {
      display: grid;
      gap: .8rem
    }

    .f {
      width: 100%;
      padding: .85rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--ln);
      background: rgba(255, 255, 255, .07);
      color: inherit;
      font: inherit
    }

    .f:focus {
      border-color: var(--go);
      outline: none
    }

    .send {
      justify-self: start;
      border: 0;
      border-radius: 999px;
      padding: .9rem 1.8rem;
      font: 800 1rem "Instrument Sans", sans-serif;
      cursor: pointer;
      color: var(--dk);
      background: linear-gradient(90deg, var(--co), var(--go));
      transition: transform .2s
    }

    .send:hover {
      transform: translateY(-3px)
    }

    .ok {
      color: var(--muted)
    }

    footer {
      padding: 2rem 0 7rem;
      color: var(--muted);
      font-size: .92rem
    }

    footer .wrap {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap
    }

    .dock {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: .2rem;
      padding: .35rem;
      border-radius: 999px;
      background: var(--gl);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ln);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, .6)
    }

    .dock a {
      padding: .5rem .9rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: .88rem;
      color: var(--muted);
      white-space: nowrap;
      transition: background .25s, color .25s
    }

    .dock a:hover {
      color: var(--ink)
    }

    .dock a.on {
      background: var(--ink);
      color: var(--dk)
    }

    @media (max-width:820px) {

      .ab,
      .pj,
      .ct {
        grid-template-columns: 1fr
      }

      .pj.alt .mw {
        order: 0
      }

      .cue {
        display: none
      }
    }

    @media (max-width:520px) {
      .dock a {
        padding: .45rem .55rem;
        font-size: .74rem
      }
    }

    @media (prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    .sh {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem
    }

    .sh::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--ln)
    }

    .sh h2 {
      margin: 0
    }

    .eb {
      font: 700 .9rem "Instrument Sans", sans-serif;
      color: var(--co)
    }

    .kick {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .3rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--ln);
      background: var(--gl);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-weight: 600;
      font-size: .88rem;
      margin-bottom: 1.4rem
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--go);
      flex: none;
      animation: pulse 2s infinite
    }

    .fs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 2.5rem;
      border: 1px solid var(--ln);
      border-radius: 20px;
      background: var(--gl);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px)
    }

    .fs>div {
      padding: 1.1rem 1.3rem;
      border-left: 1px solid var(--ln)
    }

    .fs>div:first-child {
      border-left: 0
    }

    .fs span {
      display: block;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600
    }

    .fs b {
      display: block;
      font: 800 1.3rem/1.15 "Big Shoulders Display", sans-serif;
      text-transform: uppercase;
      letter-spacing: .01em
    }

    .pr {
      position: relative;
      overflow: hidden;
      flex: none;
      width: clamp(110px, 16vw, 170px);
      border-radius: 999px 999px 22px 22px;
      padding: 3px
    }

    .pr::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: conic-gradient(var(--go), var(--co), transparent 35%, transparent 60%, var(--go));
      animation: spin 7s linear infinite
    }

    .pr .ph {
      width: 100%;
      border: 0;
      border-radius: 999px 999px 19px 19px;
      background: #1b1340;
      position: relative;
      z-index: 1
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .vp {
      height: clamp(220px, 30vw, 270px);
      overflow: hidden;
      position: relative
    }

    .cn {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px
    }

    .cn.mid {
      align-items: center
    }

    .cn .b,
    .cn .btnm,
    .cn .inp,
    .cn .q {
      flex: none
    }

    .cn .cards.two {
      grid-template-columns: repeat(2, 1fr)
    }

    .cn .cards i {
      height: 60px
    }

    #net {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none
    }

    .tp {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px));
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: var(--gl);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      color: var(--ink);
      font-size: 1.1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      display: grid;
      place-items: center
    }

    .tp svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg)
    }

    .tp circle {
      fill: none;
      stroke-width: 2.5
    }

    .tp .tr {
      stroke: var(--ln)
    }

    .tp .pg {
      stroke: var(--go);
      stroke-dashoffset: 138
    }

    @media (max-width:700px) {
      .fs {
        grid-template-columns: 1fr
      }

      .fs>div {
        border-left: 0
      }

      .fs>div+div {
        border-top: 1px solid var(--ln)
      }
    }

    .send:disabled {
      opacity: .6;
      cursor: wait
    }

    .err {
      color: #ffc2b0;
      font-weight: 600;
      margin-top: .8rem
    }

    .err a {
      text-decoration: underline
    }

    .ok {
      margin-top: .8rem
    }

    .vp.auto {
      height: auto
    }

    .shot {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .6s cubic-bezier(.2, .7, .2, 1)
    }

    .pj:hover .shot {
      transform: scale(1.03)
    }
  </style>
</head>
